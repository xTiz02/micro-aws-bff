spring:
  application:
    name: bff-client
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

app:
  clients:
    catalog-service:
      timeout-ms: 3000
    order-service:
      timeout-ms: 3000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId:-}] [%15.15t] %-40.40logger{39} : %m%n"
